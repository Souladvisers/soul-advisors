<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>When I Pass Away — SOUL Advisors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--gold:#A8834A;--gold-light:#C9A56A;--navy:#0d1526;--sidebar:290px;--paper:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#1a2035;display:flex;height:100vh;overflow:hidden}

/* ---- sidebar ---- */
.sb{width:var(--sidebar);min-width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;padding:0 0 24px}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid #1e2d4a}
.sb-head h1{font-size:14px;font-weight:700;color:#fff;letter-spacing:.4px}
.sb-head p{font-size:11px;color:#8899bb;margin-top:3px}
.fields{display:flex;flex-direction:column;gap:14px;padding:20px}
.f label{display:block;font-size:11px;color:#8899bb;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.f input,.f select{width:100%;background:#14213d;border:1px solid #253555;border-radius:6px;color:#e8eef8;font-size:13px;padding:7px 10px;outline:none;transition:border-color .15s;font-family:inherit}
.f input:focus,.f select:focus{border-color:var(--gold-light)}
.f input::placeholder{color:#445}
.div{border:none;border-top:1px solid #1e2d4a;margin:0}
.btns{padding:0 20px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btn{padding:9px 14px;border:none;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:background .15s}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:var(--gold-light)}
.btn-sec{background:#14213d;color:#aabbcc;border:1px solid #253555}
.btn-sec:hover{background:#1c2f50}
.note{font-size:11px;color:#667799;padding:0 20px;line-height:1.5}

/* ---- main ---- */
.main{flex:1;overflow-y:auto;padding:36px;display:flex;justify-content:center;background:#e9e6e0}

/* ---- paper ---- */
.paper{width:794px;min-height:1123px;background:var(--paper);font-family:Georgia,'Times New Roman',serif;position:relative;padding:52px 60px 52px}
.paper::before,.paper::after{content:'';position:absolute;pointer-events:none}
.paper::before{inset:18px;border:1.2px solid var(--gold)}
.paper::after{inset:22px;border:.4px solid var(--gold)}

/* ---- document styles ---- */
.dtitle{text-align:center;font-size:26px;font-weight:700;letter-spacing:2.5px;color:#111;margin-bottom:8px}
.dsub{text-align:center;font-style:italic;color:var(--gold);font-size:14px;margin-bottom:16px}
.dintro{text-align:center;font-size:12px;color:#444;line-height:1.65;max-width:480px;margin:0 auto 20px}
.dline{border:none;border-top:.8px solid var(--gold);margin:0 0 22px}
.step{display:grid;grid-template-columns:38px 1fr 24px;gap:0 14px;margin-bottom:18px;align-items:start}
.snum{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-family:Georgia,serif}
.stitle{font-size:13px;font-weight:700;color:#111;margin-bottom:3px}
.sdesc{font-size:11.5px;color:#3a3a3a;line-height:1.65}
.sbox{width:16px;height:16px;border:1.2px solid #aaa;border-radius:1px;margin-top:10px;flex-shrink:0}
.contacts{margin-top:16px;border-top:.8px solid var(--gold);padding-top:16px}
.contacts-title{font-size:12px;font-weight:700;color:#111;margin-bottom:10px}
.ctable{width:100%;border-collapse:collapse;font-size:11px}
.ctable th,.ctable td{border:1px solid #ccc;padding:5px 8px;text-align:left}
.ctable th{background:#f5f0e8;font-weight:700;font-size:10.5px}
.foot{text-align:center;font-style:italic;font-size:9.5px;color:#888;margin-top:20px}

@media print{
  body{display:block;background:#fff}
  .sb,.btns,.sb-head{display:none}
  .main{padding:0;background:#fff;overflow:visible}
  .paper{box-shadow:none;width:100%;min-height:0;page-break-inside:avoid}
  .paper::before,.paper::after{display:none}
}
</style>
</head>
<body>

<div class="sb">
  <div class="sb-head">
    <h1>When I Pass Away</h1>
    <p>Family checklist — print &amp; file with Will</p>
  </div>
  <div class="fields">
    <div class="f"><label>Name of the deceased</label><input id="iName" placeholder="Full name as in NRIC" oninput="render()"></div>
    <div class="f"><label>Executor's name</label><input id="iExec" placeholder="As named in the Will" oninput="render()"></div>
    <div class="f"><label>Executor's phone</label><input id="iExecPh" placeholder="+65 9xxx xxxx" oninput="render()"></div>
    <div class="f"><label>Mosque / khairat scheme</label><input id="iMosque" placeholder="e.g. Masjid Sultan" oninput="render()"></div>
    <div class="f"><label>Adviser (SOUL Advisors)</label><input id="iAdv" placeholder="Adviser's name" oninput="render()"></div>
    <div class="f"><label>Adviser's phone</label><input id="iAdvPh" placeholder="+65 9xxx xxxx" oninput="render()"></div>
    <div class="f"><label>Lawyer (optional)</label><input id="iLaw" placeholder="Lawyer's name and firm" oninput="render()"></div>
  </div>
  <hr class="div">
  <div class="btns">
    <button class="btn btn-gold" onclick="downloadPdf()">Download PDF</button>
    <button class="btn btn-sec" onclick="window.print()">Print</button>
  </div>
  <p class="note" style="margin-top:14px">Print and place in front of the Will. Do not staple to the Will.</p>
</div>

<div class="main">
  <div class="paper" id="paper"></div>
</div>

<script>
const esc = t => String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g = id => document.getElementById(id).value.trim();

function steps(){
  const ex = g('iExec'), exPh = g('iExecPh'), mosque = g('iMosque'), adv = g('iAdv'), khairat = g('iMosque');
  const exStr = ex ? ex + (exPh ? ` (${exPh})` : '') : 'the Executor named in the Will';
  const mosqueStr = mosque || 'the mosque';
  const advStr = adv ? `, ${adv}` : '';
  return [
    ['Certify and register the death',
      'Call a doctor to certify the death, or <b>995</b> if it is sudden or unexpected. The death is registered and a digital death certificate is issued. The <b>MyLegacy portal</b> (mylegacy.life.gov.sg) guides you through the next steps.'],
    ['Arrange the funeral promptly',
      `Contact ${esc(mosqueStr)} and any khairat scheme. Burial should take place as soon as practicable. See the Memorandum of Wishes for funeral wishes.`],
    ['Inform the Executor',
      `Contact <b>${esc(exStr)}</b> and hand over this file. The original Will must not be unstapled, marked or altered.`],
    ['Do not distribute any assets yet',
      'Do not sell, withdraw or share out any money or property until the Executor has obtained the necessary court documents.'],
    ['Apply for the Inheritance Certificate',
      'The Executor applies to the <b>Syariah Court of Singapore</b> for the Inheritance Certificate (<i>Sijil Faraid</i>), which sets out the lawful heirs and their shares under Faraid, and then applies for the <b>Grant of Probate</b> at the Family Justice Courts.'],
    ['Contact CPF, banks and insurers',
      `CPF monies are paid directly to nominees and do not form part of the estate. For insurance claims and policy matters, contact the adviser below${esc(advStr)}, who can assist the family.`],
    ['Settle debts before distribution',
      'Funeral costs, debts owed to others, and outstanding <b>zakat, fidyah</b> or <b>badal haji</b> are settled first. The balance is then distributed according to the Will and the Inheritance Certificate.'],
  ];
}

function render(){
  const name = g('iName') || '______________________________';
  const exec = g('iExec'); const execPh = g('iExecPh');
  const adv = g('iAdv'); const advPh = g('iAdvPh');
  const mosque = g('iMosque'); const law = g('iLaw');

  let h = `
    <div class="dtitle">WHEN I PASS AWAY</div>
    <div class="dsub">A checklist for the family of ${esc(name)}</div>
    <div class="dintro">Inna lillahi wa inna ilayhi raji&rsquo;un. Please keep this file safe and follow these steps in order. Do not unstaple, mark or remove pages from the original Will.</div>
    <hr class="dline">
  `;

  steps().forEach(([title, desc], i) => {
    h += `<div class="step">
      <div class="snum">${i+1}</div>
      <div><div class="stitle">${title}</div><div class="sdesc">${desc}</div></div>
      <div class="sbox"></div>
    </div>`;
  });

  h += `<div class="contacts">
    <div class="contacts-title">Important contacts</div>
    <table class="ctable">
      <tr><th>Contact</th><th>Name</th><th>Phone</th></tr>
      <tr><td>Executor</td><td>${esc(exec)}</td><td>${esc(execPh)}</td></tr>
      <tr><td>Adviser (SOUL Advisors)</td><td>${esc(adv)}</td><td>${esc(advPh)}</td></tr>
      <tr><td>Mosque / khairat scheme</td><td>${esc(mosque)}</td><td></td></tr>
      <tr><td>Lawyer</td><td>${esc(law)}</td><td></td></tr>
    </table>
  </div>
  <div class="foot">This checklist is a guide only. It is not part of the Will or the Memorandum of Wishes.</div>`;

  document.getElementById('paper').innerHTML = h;
}

function downloadPdf(){
  if(!window.jspdf){ alert('PDF library not loaded. Please check your connection and reload.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });

  const name = g('iName') || '______________________________';
  const exec = g('iExec'); const execPh = g('iExecPh');
  const adv = g('iAdv'); const advPh = g('iAdvPh');
  const mosque = g('iMosque'); const law = g('iLaw');
  const exStr = exec ? exec + (execPh ? ' ('+execPh+')' : '') : 'the Executor named in the Will';
  const mosqueStr = mosque || 'the mosque';
  const advStr = adv ? ', '+adv : '';

  const PW=595.28, PH=841.89, X0=60, X1=PW-60, W=X1-X0;
  const GOLD=[168,131,74], INK=[20,20,20], GREY=[80,80,80];
  let y=50;

  // double frame
  doc.setDrawColor(...GOLD); doc.setLineWidth(1.2); doc.rect(28,28,PW-56,PH-56);
  doc.setLineWidth(0.3); doc.rect(34,34,PW-68,PH-68); doc.setDrawColor(0);

  const T=(txt,x,yy,o={})=>{
    doc.setFont('times', o.b&&o.i?'bolditalic':o.b?'bold':o.i?'italic':'normal');
    doc.setFontSize(o.s||11); doc.setTextColor(...(o.c||INK));
    doc.text(txt,x,yy, o.al?{align:o.al}:undefined);
  };
  const wrap=(txt,w,s=11,b=false)=>{doc.setFont('times',b?'bold':'normal');doc.setFontSize(s);return doc.splitTextToSize(String(txt).replace(/\*/g,''),w);};

  // title
  T('WHEN I PASS AWAY', PW/2, y+32, {b:true, s:22, al:'center'});  y+=46;
  T(`A checklist for the family of ${name}`, PW/2, y, {i:true, s:12, c:GOLD, al:'center'}); y+=16;

  // intro
  const intro = wrap(`Inna lillahi wa inna ilayhi raji’un. Please keep this file safe and follow these steps in order. Do not unstaple, mark or remove pages from the original Will.`, W-80, 10.5);
  intro.forEach((ln,k)=>T(ln, PW/2, y+13+k*14, {s:10.5, al:'center'})); y += 13+intro.length*14+14;

  // gold line
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.7); doc.line(X0,y,X1,y); doc.setDrawColor(0); y+=16;

  // steps
  const pdfSteps = [
    ['Certify and register the death','Call a doctor to certify the death, or 995 if it is sudden or unexpected. The death is registered and a digital death certificate is issued. The MyLegacy portal (mylegacy.life.gov.sg) guides you through the next steps.'],
    ['Arrange the funeral promptly',`Contact ${mosqueStr} and any khairat scheme. Burial should take place as soon as practicable. See the Memorandum of Wishes for funeral wishes.`],
    ['Inform the Executor',`Contact ${exStr} and hand over this file. The original Will must not be unstapled, marked or altered.`],
    ['Do not distribute any assets yet','Do not sell, withdraw or share out any money or property until the Executor has obtained the necessary court documents.'],
    ['Apply for the Inheritance Certificate','The Executor applies to the Syariah Court of Singapore for the Inheritance Certificate (Sijil Faraid), which sets out the lawful heirs and their shares under Faraid, and then applies for the Grant of Probate at the Family Justice Courts.'],
    ['Contact CPF, banks and insurers',`CPF monies are paid directly to nominees and do not form part of the estate. For insurance claims and policy matters, contact the adviser below${advStr}, who can assist the family.`],
    ['Settle debts before distribution','Funeral costs, debts owed to others, and outstanding zakat, fidyah or badal haji are settled first. The balance is then distributed according to the Will and the Inheritance Certificate.'],
  ];

  pdfSteps.forEach(([title, desc], i)=>{
    const descLines = wrap(desc, W-50, 10.5);
    const blockH = 16+descLines.length*13.5+10;
    if(y+blockH>PH-120){ doc.addPage(); doc.setDrawColor(...GOLD); doc.setLineWidth(1.2); doc.rect(28,28,PW-56,PH-56); doc.setLineWidth(0.3); doc.rect(34,34,PW-68,PH-68); doc.setDrawColor(0); y=60; }
    const cy=y;
    // circle
    doc.setFillColor(...GOLD); doc.circle(X0+11, cy-3, 11, 'F');
    T(String(i+1), X0+11, cy+1.5, {b:true, s:12, c:[255,255,255], al:'center'});
    // checkbox
    doc.setDrawColor(140,140,140); doc.setLineWidth(0.7); doc.rect(X1-13, cy-10, 12, 12); doc.setDrawColor(0);
    // title
    T(title, X0+30, cy, {b:true, s:12});
    descLines.forEach((ln,k)=>T(ln, X0+30, cy+15+k*13.5, {s:10.5, c:GREY}));
    y = cy+15+descLines.length*13.5+8;
  });

  // contacts table
  y += 8;
  if(y+80>PH-50){ doc.addPage(); doc.setDrawColor(...GOLD); doc.setLineWidth(1.2); doc.rect(28,28,PW-56,PH-56); doc.setLineWidth(0.3); doc.rect(34,34,PW-68,PH-68); doc.setDrawColor(0); y=60; }
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.7); doc.line(X0,y,X1,y); doc.setDrawColor(0); y+=14;
  T('Important contacts', X0, y, {b:true, s:12}); y+=10;
  const cw=[140,220,W-360];
  const cRows=[['Contact','Name','Phone'],['Executor',exec,execPh],['Adviser (SOUL Advisors)',adv,advPh],['Mosque / khairat scheme',mosque,''],['Lawyer',law,'']];
  cRows.forEach((row,ri)=>{
    const cells=row.map((c,j)=>wrap(String(c||''),cw[j]-8,10,ri===0));
    const rh=Math.max(...cells.map(c=>c.length))*12+8;
    let x=X0;
    cells.forEach((c,j)=>{
      if(ri===0){doc.setFillColor(242,236,224);doc.rect(x,y,cw[j],rh,'F');}
      doc.setDrawColor(180,170,160);doc.setLineWidth(0.4);doc.rect(x,y,cw[j],rh);doc.setDrawColor(0);
      c.forEach((ln,k)=>T(ln,x+4,y+9+k*12,{s:10,b:ri===0}));
      x+=cw[j];
    });
    y+=rh;
  });

  // footer
  T('This checklist is a guide only. It is not part of the Will or the Memorandum of Wishes.', PW/2, PH-36, {i:true, s:9, c:[130,130,130], al:'center'});

  doc.setProperties({title:`When I Pass Away – ${name}`, creator:'SOUL Advisors'});
  doc.save(`When_I_Pass_Away_${(name||'Draft').replace(/[^\w]+/g,'_')}.pdf`);
}

render();
</script>
</body>
</html>
