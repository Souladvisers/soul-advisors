<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estate Gap Check | SOUL Guild</title>
<meta name="description" content="Free 3-minute check: see who would inherit your estate in Singapore, your Estate Readiness Score, and the gaps to close first. Muslim (faraid) and general paths.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SOUL Guild">
<meta property="og:title" content="Estate Gap Check: free 3-minute check">
<meta property="og:description" content="See who would inherit your estate, your readiness score, and the gaps to close first.">
<meta property="og:url" content="https://soul-advisors.vercel.app/estate-check">
<meta property="og:image" content="https://soul-advisors.vercel.app/estate-check-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a single guided column, four or five steps, ending in a scannable report (score → distribution → gaps → next step). */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#14201e; --muted:#566864; --line:#dbe3e0;
  --accent:#1c5a50; --accent-ink:#ffffff; --accent-soft:#e2eeeb; --brass:#9c7028;
  --crit:#b23a30; --warn:#a86d12; --good:#2d7449;
  --crit-soft:#f8e7e5; --warn-soft:#f7eedd; --good-soft:#e3f1e8;
  --c1:#1c5a50; --c2:#4f9a8b; --c3:#9cc9bd; --c4:#9c7028; --c5:#d2ab6a; --c6:#8b9592;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --ink:#e6eeec; --muted:#9db0ab; --line:#2a3936;
    --accent:#62b6a5; --accent-ink:#0e1514; --accent-soft:#1d3330; --brass:#d6a85a;
    --crit:#ee7d72; --warn:#e5ad4c; --good:#6dc690;
    --crit-soft:#3a201e; --warn-soft:#382c17; --good-soft:#1b3326;
    --c1:#62b6a5; --c2:#3f8577; --c3:#a6d6ca; --c4:#d6a85a; --c5:#8c6a30; --c6:#6f7c79;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --ink:#e6eeec; --muted:#9db0ab; --line:#2a3936;
  --accent:#62b6a5; --accent-ink:#0e1514; --accent-soft:#1d3330; --brass:#d6a85a;
  --crit:#ee7d72; --warn:#e5ad4c; --good:#6dc690;
  --crit-soft:#3a201e; --warn-soft:#382c17; --good-soft:#1b3326;
  --c1:#62b6a5; --c2:#3f8577; --c3:#a6d6ca; --c4:#d6a85a; --c5:#8c6a30; --c6:#6f7c79;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
.proto{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px;margin-bottom:20px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;font-size:14px;color:var(--muted)}
.brand b{color:var(--ink);letter-spacing:.06em;font-weight:700}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(32px,6vw,46px)}
h2{font-size:28px}
h3{font-size:21px}
p{margin:0}
.lede{font-size:18px;color:var(--muted);max-width:60ch;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
.stack{display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px}
@media (max-width:560px){.paths{grid-template-columns:1fr}}
.path{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s, transform .15s}
.path:hover{border-color:var(--accent);transform:translateY(-1px)}
.path:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.path .t{font-family:var(--display);font-size:22px;font-weight:600}
.path .d{color:var(--muted);font-size:14px}
.path .go{color:var(--accent);font-weight:600;font-size:14px;margin-top:4px}
.gets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
@media (max-width:560px){.gets{grid-template-columns:1fr}}
.gets div{border-top:2px solid var(--brass);padding-top:10px;font-size:14px;color:var(--muted)}
.gets b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
.progress{display:flex;gap:8px;margin-bottom:24px}
.progress span{flex:1;font-size:12px;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.progress span.on{border-color:var(--accent);color:var(--ink);font-weight:600}
.progress span.done{border-color:var(--accent);opacity:.7}
.q{display:flex;flex-direction:column;gap:8px}
.q>label,.q>.lbl{font-weight:600;font-size:15px}
.hint{font-size:13px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:focus-visible,.step button:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden;width:max-content}
.step button{font:inherit;width:40px;height:38px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:18px}
.step button:disabled{opacity:.35;cursor:default}
.step output{min-width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.money{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=text],input[type=tel],input[type=email]{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{margin-top:4px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.err{color:var(--crit);font-size:13px;min-height:1em}
.sub{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);padding-top:6px;border-top:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;padding:12px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.link{font:inherit;background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}
/* report */
.scorebox{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .n b{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.ring .n small{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.good{background:var(--good-soft);color:var(--good)}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:16px 0 6px}
.bar span{display:block;height:100%}
.bar span+span{border-left:2px solid var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:baseline}
.tblwrap{overflow-x:auto}
.callout{border-left:3px solid var(--brass);padding:4px 0 4px 14px;font-size:15px}
.gap{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.gap:first-child{border-top:0;padding-top:4px}
.gap .stripe{width:4px;border-radius:2px;flex:none}
.gap.crit .stripe{background:var(--crit)}
.gap.warn .stripe{background:var(--warn)}
.gap.good .stripe{background:var(--good)}
.gap h4{margin:0 0 4px;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gap p{font-size:14px;color:var(--muted);max-width:62ch}
.cta{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:26px}
.cta h3{font-size:24px}
.cta p{opacity:.9;margin-top:8px;max-width:58ch}
.cta .btn{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink);margin-top:18px}
.cta .ok{margin-top:14px;font-size:14px;font-weight:600}
.gloss{display:grid;grid-template-columns:minmax(140px,190px) 1fr;gap:10px 18px;margin:14px 0 0;font-size:14px}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--muted)}
@media (max-width:560px){.gloss{grid-template-columns:1fr;gap:2px}.gloss dd{margin-bottom:10px}}
td.why{min-width:180px;font-size:13px}
.fine{font-size:12px;color:var(--muted);line-height:1.5}
.muted{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>SOUL GUILD</b><span>Estate Planning</span></div>
  <main id="app" aria-live="polite"></main>
  <p class="fine" style="margin-top:32px">This check is a simplified educational illustration and is not legal, financial or religious advice.</p>
</div>

<script src="/estate-check-engine.js"></script>
<script>
/* ===== SETTINGS: fill these in before going live (see README) ===== */
const CONFIG = {
  SHEET_URL: "https://script.google.com/macros/s/AKfycbxbKbdb_0RfplAQaKZHs6w7pVQzk90HJj8JT2RmZcK8_MkfVHHI_GElwSLcSAyIGaVK/exec", // Google Apps Script web app ("Estate Gap Check - Lead Capture")
  WHATSAPP_DEFAULT: "6585229299", // number that receives bookings, country code first, no + or spaces
  FC_WHATSAPP: {                  // optional extra codes; team members in data.json are added automatically
    // "aisyah": "6591234567",
  }
};
/* ================================================================== */
const params = new URLSearchParams(location.search);
const SRC = (params.get("src") || "direct").slice(0,40);
const FC = (params.get("fc") || "").toLowerCase().slice(0,40);
const DEMO = params.get("demo") === "1";
function send(payload){
  if (!CONFIG.SHEET_URL){ console.warn("SHEET_URL not set; lead not saved", payload); return; }
  try { fetch(CONFIG.SHEET_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(payload)}); } catch(e){ console.warn(e); }
}
/* Team members from the site's data.json: ?fc=<member id or first name> routes bookings to them */
fetch("/data.json").then(r=>r.json()).then(d=>{
  (d.members||[]).forEach(m=>{
    [m.id, m.subdomain, ...String(m.name||"").split(/\s+/)].filter(Boolean).map(k=>String(k).toLowerCase())
      .forEach(k=>{ if (!(k in FC_NAMES)) FC_NAMES[k]=String(m.name||k).trim(); });
    let n = String(m.whatsapp||"").replace(/\D/g,""); if (!n) return;
    if (n.length===8) n = "65"+n;
    const keys = [m.id, m.subdomain, ...String(m.name||"").split(/\s+/)].filter(Boolean).map(k=>String(k).toLowerCase());
    keys.forEach(k=>{ if (!(k in CONFIG.FC_WHATSAPP)) CONFIG.FC_WHATSAPP[k]=n; });
  });
  if (state.step===3) render();
}).catch(()=>{});
const FC_NAMES = {};
function fcLabel(){ return FC ? (FC_NAMES[FC] || FC) : ""; }
function waNumber(){ return CONFIG.FC_WHATSAPP[FC] || CONFIG.WHATSAPP_DEFAULT; }
const fmt = n => "S$" + Math.round(n).toLocaleString("en-SG");
const pct = n => (Math.round(n*1000)/10).toFixed(1).replace(/\.0$/,"") + "%";
const E = window.EstateEngine;

const DEFAULTS = {
  gender:"male", married:"married", wives:1, sons:1, daughters:1, minor:"yes",
  children:2, deceasedChildLines:0, siblings:0,
  sonsSons:0, sonsDaughters:0, father:"no", mother:"yes", grandfather:"no", gmMaternal:"no", gmPaternal:"no",
  fullBrothers:2, fullSisters:1, patBrothers:0, patSisters:0, uterine:0,
  fullNephews:0, patNephews:0, fullUncles:0, patUncles:0, fullCousins:0, patCousins:0,
  nonMuslim:"no", nmSpouse:"no", nmFather:"no", nmMother:"no",
  estate:600000,
  will:"no", cpf:"notsure", ins:"some", lpa:"no", property:"hdb", holding:"joint",
  hibah:"no", guardian:"no", overseas:"no", docs:"partly", cash:"notsure"
};
const state = { path:null, stepId:"intro", a:{...DEFAULTS}, lead:{name:"",mobile:"",email:"",consent:false}, booked:false };
const STEP_LABELS = { family:"Your family", wider:"Wider family", arr:"Your arrangements", lead:"Your details", report:"Your report" };
const app = document.getElementById("app");

/* ---------- who is alive and counts as an heir ---------- */
const isM = () => state.path === "muslim";
const A = () => state.a;
const yes = k => A()[k] === "yes";
const married = () => A().married === "married";
const nm = k => yes("nonMuslim") && yes(k);
const spouseHeir = () => married() && !(isM() && A().gender === "male" && nm("nmSpouse"));
const fatherHeir = () => yes("father") && !(isM() && nm("nmFather"));
const motherHeir = () => yes("mother") && !(isM() && nm("nmMother"));
const kids = () => isM() ? A().sons + A().daughters : A().children;
const descM = () => A().sons + (A().sons ? 0 : A().sonsSons) > 0;
const desc = () => descM() || A().daughters + (A().sons ? 0 : A().sonsDaughters) > 0;
const gfHeir = () => !fatherHeir() && yes("grandfather");
const sibTotal = () => A().fullBrothers + A().fullSisters + A().patBrothers + A().patSisters + A().uterine;

const ask = {
  grandkids: () => A().sons === 0,
  grandfather: () => !fatherHeir(),
  grandmothers: () => !motherHeir(),
  siblings: () => (motherHeir() && !desc()) || (!descM() && !fatherHeir()),
  extended: () => !descM() && !fatherHeir() && !gfHeir() && A().fullBrothers === 0 && A().patBrothers === 0
    && !(!descM() && desc() && A().fullSisters + A().patSisters > 0)
};
const widerNeeded = () => isM() && (ask.grandkids() || ask.grandfather() || ask.grandmothers() || ask.siblings());
const steps = () => ["family", widerNeeded() ? "wider" : null, "arr", "lead", "report"].filter(Boolean);

function heirsInput(){
  const a = A();
  const g = (k, on) => on ? a[k] : 0;
  return {
    gender:a.gender, married:spouseHeir(), wives:a.wives,
    sons:a.sons, daughters:a.daughters,
    sonsSons:g("sonsSons", ask.grandkids()), sonsDaughters:g("sonsDaughters", ask.grandkids()),
    father:fatherHeir(), mother:motherHeir(),
    grandfather:ask.grandfather() && yes("grandfather"),
    gmMaternal:ask.grandmothers() && yes("gmMaternal"), gmPaternal:ask.grandmothers() && !fatherHeir() && yes("gmPaternal"),
    fullBrothers:g("fullBrothers", ask.siblings()), fullSisters:g("fullSisters", ask.siblings()),
    patBrothers:g("patBrothers", ask.siblings()), patSisters:g("patSisters", ask.siblings()), uterine:g("uterine", ask.siblings()),
    fullNephews:g("fullNephews", ask.extended()), patNephews:g("patNephews", ask.extended()),
    fullUncles:g("fullUncles", ask.extended()), patUncles:g("patUncles", ask.extended()),
    fullCousins:g("fullCousins", ask.extended()), patCousins:g("patCousins", ask.extended())
  };
}
function distribution(){
  const a = A();
  if (isM()) return E.faraid(heirsInput());
  return E.intestacy({ married:married(), children:a.children, deceasedChildLines:a.deceasedChildLines,
    father:yes("father"), mother:yes("mother"), siblings:a.siblings });
}

/* ---------- UI helpers ---------- */
function seg(k, opts){
  return `<div class="seg" role="group">` + opts.map(([v,l]) =>
    `<button type="button" data-k="${k}" data-v="${v}" aria-pressed="${A()[k]===v}">${l}</button>`).join("") + `</div>`;
}
function stepper(k, min, max){
  const v = A()[k];
  return `<div class="step"><button type="button" data-step="${k}" data-d="-1" aria-label="Decrease" ${v<=min?"disabled":""}>&minus;</button><output>${v}</output><button type="button" data-step="${k}" data-d="1" aria-label="Increase" ${v>=max?"disabled":""}>+</button></div>`;
}
const q = (label, ctrl, hint="") => `<div class="q"><span class="lbl">${label}</span>${hint?`<span class="hint">${hint}</span>`:""}${ctrl}</div>`;
const sub = t => `<div class="sub">${t}</div>`;
const YN = [["yes","Yes"],["no","No"]];
const YNS = [["yes","Yes"],["no","No"],["notsure","Not sure"]];
const ALIVE = [["yes","Alive"],["no","Passed away"]];

/* ---------- Views ---------- */
function viewIntro(){
  return `
  <h1>If something happened to you tomorrow, would your family get what you intend?</h1>
  <p class="lede">Answer a few questions in about three minutes. You'll see who would inherit under Singapore's rules, your Estate Readiness Score, and the gaps worth closing first.</p>
  <div class="paths">
    <button class="path" data-path="muslim"><span class="t">Muslim path</span><span class="d">Faraid shares for your spouse, children, grandchildren, parents, grandparents, siblings and other relatives, plus wasiat, hibah and nominations.</span><span class="go">Start the check →</span></button>
    <button class="path" data-path="general"><span class="t">General path</span><span class="d">The Intestate Succession Act, wills, guardianship, CPF nominations and the Lasting Power of Attorney.</span><span class="go">Start the check →</span></button>
  </div>
  <div class="gets">
    <div><b>Who inherits</b>A worked split of your estate, with the reason for each share.</div>
    <div><b>Readiness score</b>Out of 100, based on the arrangements you have in place.</div>
    <div><b>What to fix first</b>Ranked by how much each gap would affect your family.</div>
  </div>`;
}
function progress(){
  const ids = steps(), cur = ids.indexOf(state.stepId);
  return `<div class="progress">${ids.map((id,i)=>`<span class="${i===cur?"on":i<cur?"done":""}">${i+1}. ${STEP_LABELS[id]}</span>`).join("")}</div>`;
}
function viewFamily(){
  const a = A(), M = isM();
  let h = `<h2>Your family</h2><p class="muted" style="margin-top:6px">${M ? "Faraid shares depend on exactly who survives you. Answer for your family as it is today." : "Who's in your family today decides who inherits if you have no will."}</p><div class="card stack" style="margin-top:18px">`;
  if (M) h += q("You are", seg("gender",[["male","Male"],["female","Female"]]), "A husband and a wife receive different faraid shares.");
  h += q("Marital status", seg("married",[["married","Married"],["single","Single"],["prev","Divorced or widowed"]]), "A former spouse doesn't inherit.");
  if (M && a.gender==="male" && married()) h += q("Number of wives", stepper("wives",1,4));
  if (M) {
    h += `<div class="grid2">${q("Sons", stepper("sons",0,12))}${q("Daughters", stepper("daughters",0,12))}</div>`;
    h += `<p class="hint" style="margin-top:-8px">Count your own living children only. Adopted children and stepchildren aren't faraid heirs, though a wasiat can provide for them.</p>`;
  } else {
    h += q("Children", stepper("children",0,12), "Include legally adopted children. Stepchildren don't inherit unless you adopted them.");
    h += q("Children who have passed away, leaving children of their own", stepper("deceasedChildLines",0,6), "Their children inherit the share their parent would have had.");
  }
  if (kids()>0) h += q("Is any child under 21?", seg("minor",YN));
  h += `<div class="grid2">${q("Your father", seg("father",ALIVE))}${q("Your mother", seg("mother",ALIVE))}</div>`;
  if (!M && !married() && a.children + a.deceasedChildLines === 0 && !yes("father") && !yes("mother"))
    h += q("Brothers and sisters", stepper("siblings",0,12), "They inherit only if you have no spouse, children or parents.");
  if (M) {
    h += q("Is anyone in your close family not Muslim?", seg("nonMuslim",YN), "This is common in families with converts. Family members who aren't Muslim don't inherit under faraid.");
    if (yes("nonMuslim")) {
      if (a.gender==="male" && married()) h += q("Is your wife not Muslim?", seg("nmSpouse",[["yes","Not Muslim"],["no","Muslim"]]));
      if (yes("father")) h += q("Is your father not Muslim?", seg("nmFather",[["yes","Not Muslim"],["no","Muslim"]]));
      if (yes("mother")) h += q("Is your mother not Muslim?", seg("nmMother",[["yes","Not Muslim"],["no","Muslim"]]));
      h += `<p class="hint">When you count children, siblings and other relatives, include only those who are Muslim.</p>`;
    }
  }

function glossary(M){

    ["Estate Readiness Score", "How many of the key arrangements you have in place, out of 100. Each item is weighted by how much its absence would affect your family. It measures preparation, not wealth."],

    ["Worth fixing", "A gap that would slow things down or cause friction, but is less likely to cause hardship."],
    ["Your estate", "What you own in your name alone when you pass away. CPF and insurance with a nominee, and property held as joint tenants, pass outside it."]
  ];
  if (M) rows.push(
    ["Faraid", "The Islamic law of inheritance. In Singapore it applies to the estate of every Muslim under the Administration of Muslim Law Act."],
    ["Fixed share", "A share set out in the Quran, such as 1/8 for a wife when there are children."],
    ["Residue (asabah)", "What is left after the fixed shares. It goes to the nearest male relative on the father's side, such as a son, father or brother, sometimes together with female relatives at two parts to one."],
    ["Al-awl", "When the fixed shares add up to more than the whole estate, every share is reduced in proportion."],
    ["Baitulmal", "The community fund administered by MUIS. It receives any remainder when there is no residuary heir."],
    ["Wasiat", "An Islamic will. It can give up to one-third of the estate to people who aren't faraid heirs, or to charity, and appoint an executor."],

    score:score(items),
    urgent:items.filter(i=>i.sev==="crit").map(i=>i.title).join(", "),
    other_gaps:items.filter(i=>i.sev==="warn").map(i=>i.title).join(", "),
    family:familySummary(),
    estate:a.estate, property:a.property==="none"?"None":`${a.property.toUpperCase()} (${a.holding})`,
    src:SRC, fc:fcLabel(), page:location.href.split("?")[0]});
  go("report");
});
render();
</script>
</body>
</html>
